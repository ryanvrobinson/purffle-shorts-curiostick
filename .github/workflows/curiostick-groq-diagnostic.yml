name: CurioStick — Groq Diagnostic (temporary)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Ignore — diagnostic only, no publishing"
        type: boolean
        default: false

concurrency:
  group: curiostick-groq-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  groq-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # ── Groq diagnostic ──
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -e ".[dev]" "jsonschema>=4"

      - name: Verify jsonschema import
        run: python -c "from jsonschema import Draft7Validator; print('JSONSCHEMA_IMPORT_OK')"

      - name: Run Groq diagnostic tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/groq_diagnostic.py
