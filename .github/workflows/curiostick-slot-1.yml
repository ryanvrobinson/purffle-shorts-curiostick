name: CurioStick Shorts — Slot 1 (9:00 AM IST)

on:
  schedule:
    # 03:30 UTC = 09:00 IST. Generates, quality-checks and schedules the slot-1 Short
    # to go public at 03:30 UTC = 09:00 AM IST (about 2 hours of lead time).
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually schedule the video on YouTube (default: dry run, nothing is published)"
        type: boolean
        default: false

concurrency:
  group: curiostick-slot-1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLOT: "1"
      # ── LLM — Groq GPT-OSS-20B (OpenAI-compatible) ──
      LLM_PROVIDER: "custom"
      LLM_BASE_URL: "https://api.groq.com/openai/v1"
      GROQ_MODEL: "openai/gpt-oss-20b"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_TEMPERATURE: "0.6"

      # ── Fact verification (Phase 2) ──
      RESEARCH_VERIFY: "true"
      LEARN_FROM_STATS: "true"

      # ── Script Doctor production threshold ──
      SCRIPT_QUALITY_THRESHOLD: "50"
      # Score and report problems, but never block MP4 production on the score.
      SCRIPT_REVIEW: "score"

      # ── Visual sources — Pixabay stock + Agnes AI images, suitability choice ──
      VISUAL_SOURCES: "pixabay,agnes"
      VISUAL_CHOICE: "suitability"
      # Hybrid mode alternates stock clips with AI images so every Short mixes both.
      VISUAL_MODE: "hybrid"
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_IMAGE_MODEL: "agnes-image-2.5-flash"

      # ── Output — 30s initial target, vertical 1080x1920 @ 30 FPS ──
      TARGET_SECONDS: "30"
      ASPECT: "9:16"
      RESOLUTION: "1080x1920"
      FPS: "30"

      # ── Niches — CurioStick identity: Earth/space/nature mysteries ──
      NICHES: "Earth's strangest geological features,Chicxulub and dinosaur extinction,deep-ocean discoveries and mysteries,geological anomalies and ancient landforms,rare natural phenomena,massive impacts and asteroid scars,planetary mysteries and cosmic events"
      TIMEZONE: "Asia/Kolkata"
      TTS_ENGINE: "edge"

      # ── YouTube — slot runs upload as private, scheduled videos ──
      UPLOAD: "true"
      GOOGLE_CLIENT_SECRETS_FILE: "credentials.json"
      YT_TOKEN_FILE: "token.json"
      YT_PRIVACY: "private"
      YT_DAILY_LIMIT: "6"
      SYNTHETIC_MEDIA: "true"
      KEEP_VIDEOS: "true"
      WATERMARK: "CurioStick"

    steps:
      - uses: actions/checkout@v4
        with:  # keep credentials so the publishing history DB can be pushed back
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      - name: Write YouTube OAuth credentials
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRETS_JSON" > credentials.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          chmod 600 credentials.json token.json

      - name: Verify environment (doctor check)
        run: python -m purffle_shorts doctor
        continue-on-error: true

      - name: Generate, quality-check and schedule Short for slot ${{ env.SLOT }}
        run: |
          RUN_DATE=$(TZ=Asia/Kolkata date +%F)
          ARGS="--slot ${{ env.SLOT }} --date $RUN_DATE --verbose"
          if [ "${{ inputs.publish }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --publish"; fi
          python -m purffle_shorts daily $ARGS

      - name: Record failure details (if run failed)
        if: failure()
        run: |
          RUN_DATE=$(TZ=Asia/Kolkata date +%F)
          echo "run_date=$RUN_DATE" >> "$GITHUB_ENV"
          echo "Slot ${{ env.SLOT }} for $RUN_DATE failed — see failure artifacts above"
          exit 0

      - name: GitHub Actions summary
        if: always()
        run: |
          if [ -f data/run-summary.md ]; then cat data/run-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Persist publishing history to main
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f data/history.db
          git diff --cached --quiet && exit 0
          # Bounded push-with-reconciliation loop. Remote slot runs only append to
          # data/history.db (idempotent by date+slot key; each slot owns its key), so
          # we merge remote history into our database, commit on top of origin/main,
          # and fast-forward push. Never force-push; never overwrite another slot's
          # records; never reset or discard history.
          MAX_ATTEMPTS=5
          attempt=0
          while [ $attempt -lt $MAX_ATTEMPTS ]; do
            attempt=$((attempt + 1))
            git fetch origin main || { echo "error: git fetch failed; not pushing history" >&2; exit 1; }
            # Merge remote's slot_uploads records into the local history.db
            # (idempotent by date+slot key). Preserves every slot's history without
            # overwriting the SQLite file wholesale or force-pushing.
            REMOTE_DB="$(mktemp)"
            if git show origin/main:data/history.db > "$REMOTE_DB" 2>/dev/null; then
          python3 scripts/merge_slot_history.py "$REMOTE_DB" "data/history.db"
            fi
            git add -f data/history.db
            git diff --cached --quiet && { echo "no changes to push"; exit 0; }
            # Commit directly on top of origin/main so the push fast-forwards.
            NEW_COMMIT="$(git commit-tree $(git write-tree) -p origin/main -m 'chore: record CurioStick slot ${{ env.SLOT }} run (${{ github.run_id }}')"
            git update-ref refs/heads/main "$NEW_COMMIT"
            if git merge-base --is-ancestor origin/main HEAD; then
            git push origin main && exit 0
            fi
            # Remote advanced between commit and push: reconcile again on the next attempt.
          done
          echo "error: failed to push history after $MAX_ATTEMPTS attempts; refusing to force-push" >&2
          exit 1

      - name: Upload logs and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curiostick-slot-1-output-${{ github.run_id }}
          path: |
            output_videos/
            data/logs/
            data/failures/
            data/run-summary.md
          retention-days: 30  # KEEP_VIDEOS=true: keep MP4s, scripts, subtitles, attribution and failure reports
                               # for 30 days (subject to GitHub Actions storage limits). MP4s are never
                               # committed into Git history; see docs/retention.md.
