name: CurioStick Shorts — Slot 3 (7:00 PM IST)

on:
  schedule:
    # 11:30 UTC = 17:00 IST. Generates, quality-checks and schedules the slot-3 Short
    # to go public at 13:30 UTC = 7:00 PM IST (about 2 hours of lead time).
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually schedule the video on YouTube (default: dry run, nothing is published)"
        type: boolean
        default: false

concurrency:
  group: curiostick-history-db-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLOT: "3"
      # ── LLM — Groq GPT-OSS-20B (OpenAI-compatible) ──
      LLM_PROVIDER: "custom"
      LLM_BASE_URL: "https://api.groq.com/openai/v1"
      GROQ_MODEL: "openai/gpt-oss-20b"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_TEMPERATURE: "0.6"

      # ── Fact verification (Phase 2) ──
      RESEARCH_VERIFY: "true"
      LEARN_FROM_STATS: "true"

      # ── Visual sources — Pixabay stock + Agnes AI images, suitability choice ──
      VISUAL_SOURCES: "pixabay,agnes"
      VISUAL_CHOICE: "suitability"
      # Hybrid mode alternates stock clips with AI images so every Short mixes both.
      VISUAL_MODE: "hybrid"
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_IMAGE_MODEL: "agnes-image-2.5-flash"

      # ── Output — 30s initial target, vertical 1080x1920 @ 30 FPS ──
      TARGET_SECONDS: "30"
      ASPECT: "9:16"
      RESOLUTION: "1080x1920"
      FPS: "30"

      # ── Niches — CurioStick identity: Earth/space/nature mysteries ──
      NICHES: "Earth's strangest geological features,Chicxulub and dinosaur extinction,deep-ocean discoveries and mysteries,geological anomalies and ancient landforms,rare natural phenomena,massive impacts and asteroid scars,planetary mysteries and cosmic events"
      TIMEZONE: "Asia/Kolkata"
      TTS_ENGINE: "edge"

      # ── YouTube — slot runs upload as private, scheduled videos ──
      UPLOAD: "true"
      GOOGLE_CLIENT_SECRETS_FILE: "credentials.json"
      YT_TOKEN_FILE: "token.json"
      YT_PRIVACY: "private"
      YT_DAILY_LIMIT: "6"
      SYNTHETIC_MEDIA: "true"
      KEEP_VIDEOS: "true"
      WATERMARK: "CurioStick"

    steps:
      - uses: actions/checkout@v4
        with:  # keep credentials so the publishing history DB can be pushed back
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      - name: Write YouTube OAuth credentials
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRETS_JSON" > credentials.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          chmod 600 credentials.json token.json

      - name: Verify environment (doctor check)
        run: python -m purffle_shorts doctor

      - name: Generate, quality-check and schedule Short for slot ${{ env.SLOT }}
        run: |
          RUN_DATE=$(TZ=Asia/Kolkata date +%F)
          ARGS="--slot ${{ env.SLOT }} --date $RUN_DATE --verbose"
          if [ "${{ inputs.publish }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --publish"; fi
          python -m purffle_shorts daily $ARGS

      - name: GitHub Actions summary
        if: always()
        run: |
          if [ -f data/run-summary.md ]; then cat data/run-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Persist publishing history to main
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f data/history.db
          git diff --cached --quiet && exit 0
          # Fetch remote first so other slots' history is absorbed before we commit, instead of after.
          git fetch origin main || { echo "error: git fetch failed; not pushing history" >&2; exit 1; }
          # Merge remote's slot_uploads records into the local history.db (idempotent by date+slot key;
          # each slot owns its key). This preserves every slot's history without overwriting the SQLite
          # file wholesale, without force-pushing, and without a binary-file rebase conflict.
          REMOTE_DB="$(mktemp)"
          if git show origin/main:data/history.db > "$REMOTE_DB" 2>/dev/null; then
          python3 - "$REMOTE_DB" "data/history.db" <<'PY'
          import sqlite3, sys
          remote_path, local_path = sys.argv[1], sys.argv[2]
          rcon = sqlite3.connect(remote_path)
          lcon = sqlite3.connect(local_path)
          rows = rcon.execute(
              "SELECT key, run_date, slot, publish_at_utc, youtube_id, title, status, "
              "created_at, updated_at, error FROM slot_uploads").fetchall()
          for row in rows:
              lcon.execute(
                  "INSERT INTO slot_uploads (key, run_date, slot, publish_at_utc, youtube_id, title, "
                  "status, created_at, updated_at, error) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?) "
                  "ON CONFLICT(key) DO UPDATE SET run_date=excluded.run_date, slot=excluded.slot, "
                  "publish_at_utc=excluded.publish_at_utc, youtube_id=excluded.youtube_id, "
                  "title=excluded.title, status=excluded.status, created_at=excluded.created_at, "
                  "updated_at=excluded.updated_at, error=excluded.error", row)
          lcon.commit()
          rcon.close()
          lcon.close()
          PY
          fi
          git add -f data/history.db
          git diff --cached --quiet && exit 0
          git commit -m "chore: record CurioStick slot ${{ env.SLOT }} run (${{ github.run_id }})"
          # If remote advanced between our fetch and this commit, reparent onto origin/main so the
          # push fast-forwards. Never force-push; never overwrite another slot's history.
          if git merge-base --is-ancestor origin/main HEAD; then
          git push origin main
          else
          RUN_DATE=$(TZ=Asia/Kolkata date +%F)
          REMOTE_DB="$(mktemp)"
          git show origin/main:data/history.db > "$REMOTE_DB" 2>/dev/null || true
          if python3 - "$REMOTE_DB" "$RUN_DATE" "${SLOT}" <<'PY'
          import sqlite3, sys
          path, run_date, slot = sys.argv[1], sys.argv[2], sys.argv[3]
          key = f"{run_date}-slot-{slot}"
          try:
              conn = sqlite3.connect(path)
              row = conn.execute(
                  "SELECT 1 FROM slot_uploads WHERE key = ? AND status = 'scheduled'", (key,)).fetchone()
              conn.close()
              sys.exit(0 if row else 1)
          except Exception:
              sys.exit(1)
          PY
          then
            echo "Slot ${SLOT} for ${RUN_DATE} already recorded on remote; nothing to push."
            exit 0
          fi
            echo "error: remote main advanced with history this run does not have; refusing to force-push or merge SQLite history" >&2
            exit 1
          fi
      - name: Upload logs and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curiostick-slot-3-output
          path: |
            output_videos/
            data/logs/
            data/failures/
            data/run-summary.md
          retention-days: 1
